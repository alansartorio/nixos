# Hosts that are the same from every machine, and that nothing is lost by
# publishing: none of them is reachable from outside the networks they sit on,
# and the addresses are RFC1918 or ZeroTier. Anything whose name or address is
# worth keeping to itself -- work machines, VPSes -- belongs in the encrypted
# list instead, which is included above this one.
#
# Read into ~/.ssh/config by home/ssh.nix, last, so a machine-specific block
# above can add a ProxyJump to any of these without restating the rest.

# Git Repos

Host github.com
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes

Host ssh.gitlab.freedesktop.org
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes

Host ssh.repo.intra.chyps.com.ar
    IdentityFile ~/.ssh/chyps
    IdentitiesOnly yes

Host aur.archlinux.org
    User aur
    IdentityFile ~/.ssh/aur
    IdentitiesOnly yes

Host ssh.dev.azure.com
    User git
    IdentityFile ~/.ssh/old
    IdentitiesOnly yes

# Physical Machines

Host orange
    Hostname 192.168.0.151

Host orange-zt
    Hostname 172.28.2.207

Host orange orange-zt
    Port 23
    User alan
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes


Host raspberry
    HostName 192.168.0.61

Host raspberry-zt
    HostName 172.28.15.41

Host raspberry raspberry-zt
    User pi
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes


Host laptop-zt
    Hostname 172.28.52.122

Host laptop
    Hostname 192.168.0.19

Host laptop laptop-zt
    User alan
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes


Host desktop
    HostName 192.168.0.146

Host desktop-zt
    HostName 172.28.208.167

Host desktop desktop-zt
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes

# Other

Host vibevm vibevm.local
    HostName 192.168.100.68
    User alan
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes

Host popos
    HostName 192.168.122.181
    User alan
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes

Host tuyuserver.local
    User alan
    IdentityFile ~/.ssh/personal
    IdentitiesOnly yes
