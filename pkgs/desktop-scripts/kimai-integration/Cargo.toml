[package]
name = "kimai-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"
# rustls rather than openssl, which is what ureq pulls by default: linking the
# system copy bakes in a store path that the next rebuild moves out from under
# the binary.
ureq = "3"
